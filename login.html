<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园宝 · 团队登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <div class="login-orb login-orb-sun"></div><div class="login-orb login-orb-coral"></div><div class="login-orb login-orb-peach"></div>
  <main class="login-shell">
    <section class="login-brand"><span class="brand-mark">校</span><p class="eyebrow">TEAM WORKSPACE</p><h1>让每个问题<br><em>都有负责人。</em></h1><p>使用团队用户名和工号登录。账号由超级管理员创建，仅限团队成员使用。</p></section>
    <section class="login-card"><span class="login-card-badge">校</span>
      <p class="eyebrow">SECURE SIGN IN</p><h2>团队账号登录</h2>
      <form id="loginForm">
        <label class="field"><span>用户名 / 姓名</span><input name="username" required autocomplete="username" placeholder="例如：zhangsan"></label>
        <label class="field"><span>工号 / 密码</span><input name="password" type="password" required autocomplete="current-password" placeholder="请输入工号"></label>
        <p id="loginError" class="login-error hidden"></p>
        <button class="button button-primary button-full" type="submit">登录工作台 →</button>
      </form>
      <small class="login-help">如无法登录，请联系超级管理员创建或启用账号。</small>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      var form = event.currentTarget, button = form.querySelector('button'), error = document.getElementById('loginError');
      button.disabled = true; button.textContent = '正在验证…'; error.classList.add('hidden');
      try { var data = Object.fromEntries(new FormData(form).entries()); var result = await window.PATCHWORK_AUTH.signIn(data.username, data.password); if (result.error) throw result.error; window.location.replace(new URLSearchParams(window.location.search).get('next') || 'index.html'); }
      catch (err) { error.textContent = '登录失败：用户名或工号不正确，或账号未启用。'; error.classList.remove('hidden'); button.disabled = false; button.textContent = '登录工作台 →'; }
    });
  </script>
</body>
</html>
