<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园宝 · 团队登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <div class="login-orb login-orb-peach"></div>
  <main class="login-shell">
    <section class="login-card">
      <span class="login-logo">校</span>
      <h1>校缘宝内测管理网站</h1>
      <p class="login-subtitle">内部协作入口</p>
      <form id="loginForm">
        <label class="field"><span>账号 / 姓名</span><input name="username" required autocomplete="username" placeholder="请输入账号或姓名"></label>
        <label class="field"><span>密码</span><input name="password" type="password" required autocomplete="current-password" placeholder="123"></label>
        <p id="loginError" class="login-error hidden"></p>
        <button class="button button-primary button-full" type="submit">登录</button>
      </form>
    </section>
  </main>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var button = form.querySelector('button');
      var error = document.getElementById('loginError');

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = function () { reject(new Error('无法加载 ' + src)); };
          document.head.appendChild(script);
        });
      }

      async function initialize() {
        try {
          try {
            await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
          } catch (primaryError) {
            await loadScript('https://unpkg.com/@supabase/supabase-js@2');
          }
          await loadScript('js/config.js');
          await loadScript('js/auth.js');
          if (!window.PATCHWORK_AUTH || typeof window.PATCHWORK_AUTH.signIn !== 'function') {
            throw new Error('登录组件初始化失败，请检查 Supabase 配置后刷新页面。');
          }
          button.disabled = false;
        } catch (loadError) {
          error.textContent = '登录组件加载失败，请检查网络连接后刷新页面。';
          error.classList.remove('hidden');
          button.disabled = true;
        }
      }

      button.disabled = true;
      initialize();

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        if (!window.PATCHWORK_AUTH || typeof window.PATCHWORK_AUTH.signIn !== 'function') {
          error.textContent = '登录组件尚未加载完成，请稍后重试或刷新页面。';
          error.classList.remove('hidden');
          return;
        }
        button.disabled = true; button.textContent = '正在验证…'; error.classList.add('hidden');
        try {
          var data = Object.fromEntries(new FormData(form).entries());
          var result = await window.PATCHWORK_AUTH.signIn(data.username, data.password);
          if (result.error) throw result.error;
          window.location.replace(new URLSearchParams(window.location.search).get('next') || 'index.html');
        } catch (err) {
          error.textContent = '登录失败：' + (err.message || '账号或姓名不存在，或密码不正确。');
          error.classList.remove('hidden');
          button.disabled = false; button.textContent = '登录';
        }
      });
    })();
  </script>
</body>
</html>
