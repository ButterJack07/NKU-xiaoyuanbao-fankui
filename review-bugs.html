<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>校缘宝内测管理网站 · 待审核缺陷</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/table-resize.css?v=1.4.1"></head>
<body class="bug-reports-page review-bugs-page">
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar"></header>
  <main class="dashboard-shell cases-page-shell bug-reports-shell">
    <div class="cases-topbar bug-report-breadcrumb"><div class="cases-breadcrumb"><a href="index.html">测试</a><b>›</b><strong>待审核缺陷</strong></div></div>
    <section class="cases-title"><p class="eyebrow">REVIEW / BUG REPORTS</p><h1 id="reviewTitle">待审核缺陷</h1><p id="reviewDescription">审核缺陷报告：通过后进入下一环节，打回后提交人可修改、暂缓或取消上传；审核备注对所有成员可见。</p></section>
    <div class="cases-actions bug-report-actions"><label class="cases-search"><span>⌕</span><input id="reviewSearch" type="search" placeholder="搜索问题标题"></label></div>
    <section class="cases-table-card bug-report-table-card"><table class="cases-table department-cases-table"><thead><tr><th>缺陷编号</th><th>问题标题</th><th>提交人</th><th>归属部门</th><th>严重程度</th><th>审核环节</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="reviewList"></tbody></table><div id="reviewEmpty" class="cases-empty hidden">当前没有需要你审核的缺陷报告</div></section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=1.6"></script><script src="js/auth.js?v=1.6"></script><script src="js/workspace-nav.js?v=1.6"></script><script src="js/api.js?v=1.6"></script><script src="js/review-bugs.js?v=1.6"></script><script src="js/table-resize.js?v=1.4.1-title"></script>
</body></html>
