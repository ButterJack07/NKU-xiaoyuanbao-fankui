name: Supabase Keepalive

on:
  schedule:
    - cron: '23 4 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (read-only)
        run: |
          BASE="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          for path in "rest/v1/bug_reports?select=id&limit=1" "rest/v1/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              --retry 4 --retry-delay 10 --retry-all-errors \
              "$BASE/$path" -H "apikey: $KEY")
            echo "$path -> HTTP $code"
            [ "$code" = "200" ] && exit 0
          done
          echo "All endpoints failed"
          exit 1
