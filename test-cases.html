<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>校园宝 · 测试用例</title><link rel="stylesheet" href="css/styles.css"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span><strong>校缘宝内测管理网站</strong></span></a><nav class="topnav"><div class="nav-menu-card"><a data-nav="home" class="nav-test-root" href="index.html">测试</a><a data-department="技术—前端" href="department-bugs.html?department=技术—前端">技术—前端</a><a data-department="技术—后端" href="department-bugs.html?department=技术—后端">技术—后端</a><a data-department="设计" href="department-bugs.html?department=设计">设计</a><a data-department="产品" href="department-bugs.html?department=产品">产品</a><a data-admin-only class="admin-nav-link" href="user-management.html">超级管理员</a></div><a class="nav-notice" href="index.html#myTasksPanel">公告信息</a></nav><button id="topUserCard" class="top-user-card" type="button" onclick="window.location.href='index.html'"><span id="topUserAvatar" class="top-user-avatar">?</span><span><strong id="topUserName">当前成员</strong><small id="topUserDepartment">未登录</small></span></button></header>
<main class="dashboard-shell cases-page-shell">
  <div class="cases-topbar"><div class="cases-breadcrumb"><a href="index.html">测试</a><b>›</b><strong>测试用例</strong></div></div>
  <section class="cases-title"><p class="eyebrow">TEST GROUP / CASES</p><h1>测试用例</h1><p>测试组所有成员可查看、下载测试用例；测试组组长另可汇总、筛选与导出。</p></section>
  <div class="cases-actions"><label class="cases-search"><span>⌕</span><input id="caseSearch" type="search" placeholder="搜索文件名/上传人"></label><button id="uploadCaseButton" class="case-action-button" type="button">上传测试用例</button><button id="exportCases" class="case-action-button" type="button">批量下载/导出（ZIP）</button></div>
  <section class="cases-table-card"><table class="cases-table"><thead><tr><th class="case-select-heading"><span id="caseSelectHeading" class="hidden"><input id="selectAllCases" type="checkbox" aria-label="全选测试用例"></span></th><th><button id="sortCaseNo" class="case-sort-button" type="button">编号 <span id="caseSortIcon">↕</span></button></th><th>文件名</th><th>上传人</th><th>上传时间</th><th>文件类型</th><th>备注</th><th>操作</th></tr></thead><tbody id="caseList"></tbody></table><div id="caseEmpty" class="cases-empty hidden">暂无测试用例</div></section>
  <form id="caseForm" class="case-form cases-upload-form"><div class="cases-form-heading"><p class="eyebrow">NEW TEST CASE</p><h2>提交测试用例</h2></div><div class="field-row"><label class="field"><span>用例标题 *</span><input name="title" required placeholder="例如：用户登录成功"></label><label class="field"><span>功能模块 *</span><input name="module" required placeholder="例如：登录"></label></div><label class="field"><span>前置条件</span><textarea name="preconditions" rows="2"></textarea></label><label class="field"><span>测试步骤 *</span><textarea name="steps" rows="4" required placeholder="1. 打开页面&#10;2. 输入账号&#10;3. 点击登录"></textarea></label><div class="field-row"><label class="field"><span>预期结果 *</span><textarea name="expected_result" rows="3" required></textarea></label><label class="field"><span>优先级</span><select name="priority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></label></div><button class="case-action-button" type="submit">提交测试用例</button></form>
</main><div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/workspace-nav.js"></script><script src="js/api.js"></script><script src="js/test-cases.js"></script></body></html>
