<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>校园宝 · 测试用例</title><link rel="stylesheet" href="css/styles.css"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">校</span><span><strong>校园宝</strong><small>内测管理网站</small></span></a><nav class="topnav"><span class="nav-section-label">工作空间</span><a href="index.html"><span class="nav-icon">⌂</span>测试组首页</a><a href="index.html">缺陷看板</a><a class="active" href="test-cases.html">测试用例</a><a href="submit.html">反馈问题</a><span class="nav-section-label nav-section-spaced">部门视图</span><a href="index.html?department=测试">测试</a><a href="index.html?department=技术—前端">技术—前端</a><a href="index.html?department=技术—后端">技术—后端</a><a href="index.html?department=设计">设计</a><a href="index.html?department=产品">产品</a><a class="nav-notice" href="index.html#myTasksPanel"><span class="nav-icon">!</span>公告信息</a></nav><button class="top-user-card" type="button" onclick="window.location.href='index.html'"><span class="top-user-avatar">?</span><span><strong>当前成员</strong><small>返回工作台</small></span></button></header>
<main class="dashboard-shell"><div class="workspace-heading"><div><p class="eyebrow">TEST GROUP / CASES</p><h1>测试用例</h1><p>测试组所有成员可查看、提交、下载和导出测试用例。</p></div><span class="workspace-role">用例归档</span></div><div class="workspace-breadcrumb"><span>测试</span><b>/</b><strong>测试用例</strong><span class="workspace-date">所有成员可查看</span></div><section class="board-panel"><div class="panel-heading"><div><p class="eyebrow">TEST CASE REGISTER</p><h2>测试用例中心</h2></div><div class="panel-actions"><label class="search-field case-search"><span>⌕</span><input id="caseSearch" type="search" placeholder="搜索文件名 / 上传人"></label><button id="exportCases" class="button button-ghost button-small">批量下载 / 导出 ↓</button><button class="button button-primary button-small" type="button" onclick="document.getElementById('caseForm').scrollIntoView({behavior:'smooth'})">上传测试用例 +</button></div></div>
<form id="caseForm" class="case-form"><div class="field-row"><label class="field"><span>用例标题 *</span><input name="title" required placeholder="例如：用户登录成功"></label><label class="field"><span>功能模块 *</span><input name="module" required placeholder="例如：登录"></label></div><label class="field"><span>前置条件</span><textarea name="preconditions" rows="2"></textarea></label><label class="field"><span>测试步骤 *</span><textarea name="steps" rows="4" required placeholder="1. 打开页面&#10;2. 输入账号&#10;3. 点击登录"></textarea></label><div class="field-row"><label class="field"><span>预期结果 *</span><textarea name="expected_result" rows="3" required></textarea></label><label class="field"><span>优先级</span><select name="priority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></label></div><button class="button button-primary" type="submit">提交测试用例 →</button></form></section><section class="board-panel case-list-panel"><div class="panel-heading"><div><p class="eyebrow">COLLECTED CASES</p><h2>用例汇总</h2></div></div><div id="caseList" class="case-list"></div></section></main><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/test-cases.js"></script></body></html>
