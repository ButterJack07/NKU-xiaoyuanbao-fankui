<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>产品修改需求详情 · 校缘宝</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/product-request-actions.css?v=1.5"></head>
<body class="bug-detail-page"><div class="noise" aria-hidden="true"></div><header class="topbar"></header>
<main class="dashboard-shell bug-detail-shell">
  <div class="workspace-breadcrumb"><a id="requestHomeLink" href="index.html">产品负责人工作台</a><b>/</b><a id="requestListLink" href="product-change-requests.html">产品修改需求</a><b>/</b><strong>需求详情</strong></div>
  <section class="detail-page-heading"><p id="requestCode" class="detail-code">PRO-0001</p><h1 id="requestTitle">产品修改需求</h1><div class="detail-meta"><span>提交人：<b id="requestReporter">—</b></span><span>提交时间：<b id="requestCreated">—</b></span><span>期望时间：<b id="requestDesiredDate">—</b></span></div><div id="requestEditAction" class="detail-actions hidden"><button id="editProductRequest" class="case-action-button" type="button">编辑需求内容</button></div></section>
  <div class="bug-detail-grid">
    <section class="detail-card"><h2>产品修改需求报告</h2><dl class="detail-fields"><div><dt>涉及模块</dt><dd id="requestModule">—</dd></div><div><dt>更改原因</dt><dd id="requestReason">—</dd></div><div><dt>改前现状</dt><dd id="requestBefore">—</dd></div><div><dt>改后逻辑</dt><dd id="requestAfter">—</dd></div><div><dt>异常处理</dt><dd id="requestExceptions">—</dd></div><div><dt>影响范围</dt><dd id="requestImpact">—</dd></div><div><dt>归属部门</dt><dd id="requestDepartments">—</dd></div><div><dt>附件</dt><dd id="requestAttachments">无附件</dd></div></dl></section>
    <section class="detail-card follow-card"><h2>跟进与处理</h2><dl class="detail-fields"><div><dt>当前处理部门</dt><dd><select id="requestActionDepartment" class="request-action-department" aria-label="选择处理部门"></select></dd></div><div><dt>跟进人</dt><dd id="requestActionAssignee">—</dd></div><div><dt>当前状态</dt><dd id="requestActionStatus">—</dd></div><div><dt>处理备注</dt><dd id="requestActionNote">暂无备注</dd></div><div><dt>汇总状态</dt><dd id="requestOverallStatus">—</dd></div><div><dt>说明</dt><dd>每个部门独立更新；所有归属部门完成后，需求才算全部完成。</dd></div></dl><p id="requestNotice" class="permission-note"></p><div class="detail-actions"><button id="requestNoteButton" class="case-action-button" type="button">填写处理备注</button><button id="requestAssigneeButton" class="case-action-button" type="button">指定 / 修改跟进人</button><button id="requestTransferButton" class="detail-muted-button" type="button">更新处理部门</button><button id="requestStatusButton" class="case-action-button" type="button">更改当前状态</button></div></section>
    <section id="requestDepartmentProgress" class="detail-card review-card"><h2>各部门处理情况</h2><div id="requestDepartmentRows"></div></section>
  </div>
</main><div id="toast" class="toast"></div>
<div id="editProductRequestModal" class="modal-backdrop hidden" role="dialog" aria-modal="true"><section class="user-modal product-request-edit-modal"><div class="developer-modal-header"><div><h2>编辑产品修改需求</h2><p id="editRequestCode" class="user-modal-identity"></p><p class="user-modal-help">保存需求内容不会重置各部门已有的处理状态。</p></div><button id="closeEditProductRequest" class="icon-button" type="button">×</button></div><form id="editProductRequestForm" class="assignee-form"><label class="field"><span>需求标题 *</span><input name="title" maxlength="120" required></label><label class="field"><span>涉及模块 *</span><textarea name="module" rows="2" maxlength="1000" required></textarea></label><label class="field"><span>更改原因 *</span><textarea name="change_reason" rows="3" maxlength="3000" required></textarea></label><label class="field"><span>改前现状 *</span><textarea name="before_logic" rows="3" maxlength="3000" required></textarea></label><label class="field"><span>改后逻辑 *</span><textarea name="after_logic" rows="4" maxlength="4000" required></textarea></label><label class="field"><span>异常处理 *</span><textarea name="exception_handling" rows="3" maxlength="3000" required></textarea></label><label class="field"><span>影响范围 *</span><textarea name="impact_scope" rows="3" maxlength="3000" required></textarea></label><label class="field"><span>期望时间 *</span><input name="desired_date" type="date" required></label><label class="field field-full"><span>附件</span><div id="editRequestExistingAttachments" class="file-list"></div><label id="editRequestDropzone" class="upload-zone"><input id="editRequestAttachments" type="file" multiple><span class="upload-icon">↑</span><strong>上传需求原型、截图或补充材料</strong><small>每个文件最大 10 MB，最多 8 个</small></label><div id="editRequestFileList" class="file-list"></div></label><p id="editProductRequestError" class="login-error hidden"></p><div class="edit-user-actions"><button id="cancelEditProductRequest" class="user-cancel-button" type="button">取消</button><button id="saveProductRequestEdit" class="case-action-button" type="submit">保存修改</button></div></form></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/workspace-nav.js?v=product-lead-requests-1"></script><script src="js/api.js?v=product-lead-requests-1"></script><script src="js/attachment-preview.js"></script><script src="js/product-change-detail.js?v=1.5"></script></body></html>
