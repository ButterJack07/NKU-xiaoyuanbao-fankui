<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>校缘宝内测管理网站 · 公告消息</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="announcements-page"><div class="noise" aria-hidden="true"></div><header class="topbar"></header>
<main class="dashboard-shell announcements-shell"><section class="cases-title announcements-title"><h1>公告消息</h1><p>系统自动公告记录缺陷动态；组长和超级管理员可以发布协作公告。</p></section><div class="announcements-toolbar"><div class="announcement-tabs"><button class="announcement-tab active" data-type="all">全部</button><button class="announcement-tab" data-type="system">系统公告</button><button class="announcement-tab" data-type="manual">管理员公告</button></div><button id="publishAnnouncement" class="case-action-button hidden" type="button">发布公告</button></div><section id="announcementList" class="announcement-list"></section></main>
<div id="publishAnnouncementModal" class="modal-backdrop hidden"><section class="user-modal"><div class="developer-modal-header"><div><h2>发布公告</h2><p class="user-modal-help">公告将记录发布人、发布时间和发布范围，普通成员只能查看。</p></div><button id="closePublishAnnouncement" class="icon-button" type="button">×</button></div><form id="publishAnnouncementForm" class="user-form"><label class="field"><span>公告标题 *</span><input name="title" required placeholder="请输入公告标题"></label><label class="field"><span>公告内容 *</span><textarea name="content" rows="6" required placeholder="请输入公告内容"></textarea></label><label class="field"><span>发布范围 *</span><select name="audience" required><option value="all">全部成员</option><option value="测试">测试组</option><option value="技术—前端">技术—前端</option><option value="技术—后端">技术—后端</option><option value="设计">设计</option><option value="产品">产品</option></select></label><p id="publishAnnouncementError" class="login-error hidden"></p><div class="edit-user-actions"><button id="cancelPublishAnnouncement" class="user-cancel-button" type="button">取消</button><button class="case-action-button" type="submit">发布公告</button></div></form></section></div>
<div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/workspace-nav.js"></script><script src="js/api.js"></script><script src="js/announcements.js"></script></body></html>
