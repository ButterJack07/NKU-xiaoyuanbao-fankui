<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>校缘宝内测管理网站 · 部门缺陷列表</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="bug-reports-page department-bugs-page">
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar"></header>
  <main class="dashboard-shell cases-page-shell bug-reports-shell department-bugs-shell">
    <section class="cases-title"><p class="eyebrow"></p><h1 id="departmentBugTitle">部门缺陷列表</h1><p id="departmentBugDescription">仅显示当前归属部门的缺陷；本部门成员可查看、指定跟进人与处理；转组仅本部门组长、超级管理员可操作。</p></section>
    <div class="cases-actions bug-report-actions"><label class="cases-search"><span>⌕</span><input id="bugReportSearch" type="search" placeholder="搜索问题标题"></label><select id="bugReportStatus" class="department-select"><option value="all">状态筛选</option><option value="open">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option></select><select id="bugReportDepartment" class="department-select"><option value="all">部门筛选</option><option value="技术—前端">技术—前端</option><option value="技术—后端">技术—后端</option><option value="设计">设计</option><option value="产品">产品</option></select><button id="exportBugReports" class="case-action-button" type="button">导出报告</button></div>
    <section class="cases-table-card bug-report-table-card"><table id="bugReportTable" class="cases-table department-cases-table"><thead><tr><th>缺陷编号</th><th>问题标题</th><th>提交人</th><th>当前跟进人</th><th>状态</th><th>严重程度</th><th class="bug-updated-column">最后更新时间</th><th>操作</th></tr></thead><tbody id="bugReportList"></tbody></table><div id="bugReportEmpty" class="cases-empty hidden">当前部门暂无缺陷</div></section>
  </main>
  <div id="toast" class="toast"></div><div id="detailBackdrop" class="drawer-backdrop hidden"></div><aside id="detailDrawer" class="detail-drawer" aria-hidden="true"><div class="drawer-header"><div><p id="drawerCode" class="eyebrow"></p><h2 id="drawerTitle">问题详情</h2></div><button id="closeDrawer" class="icon-button" type="button">×</button></div><div id="drawerContent" class="drawer-content"></div></aside>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/workspace-nav.js"></script><script src="js/api.js"></script><script src="js/bug-reports.js"></script>
</body></html>
