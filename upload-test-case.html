<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校缘宝内测管理网站 · 上传测试用例</title><link rel="stylesheet" href="css/styles.css">
</head>
<body class="upload-case-page">
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="校缘宝内测管理网站首页"><span><strong>校缘宝内测管理网站</strong></span></a>
    <nav class="topnav" aria-label="主导航"><div class="nav-menu-card"><a data-nav="home" class="nav-test-root" href="index.html">测试</a><a data-department="技术—前端" href="department-bugs.html?department=技术—前端">技术—前端</a><a data-department="技术—后端" href="department-bugs.html?department=技术—后端">技术—后端</a><a data-department="设计" href="department-bugs.html?department=设计">设计</a><a data-department="产品" href="department-bugs.html?department=产品">产品</a><a data-admin-only class="admin-nav-link" href="user-management.html">超级管理员</a></div><a class="nav-notice" href="index.html#myTasksPanel">公告信息</a></nav>
    <button id="topUserCard" class="top-user-card" type="button" onclick="window.location.href='index.html'"><span id="topUserAvatar" class="top-user-avatar">?</span><span><strong id="topUserName">当前成员</strong><small id="topUserDepartment">未登录</small></span></button>
  </header>
  <main class="dashboard-shell upload-case-shell">
    <div class="cases-topbar"><div class="cases-breadcrumb"><a href="index.html">测试</a><b>›</b><a href="test-cases.html">测试用例</a><b>›</b><strong>上传测试用例</strong></div></div>
    <section class="cases-title upload-case-title"><p class="eyebrow">TEST GROUP / UPLOAD</p><h1>上传测试用例</h1><p>请上传已在本地完成的测试用例文件；网站将自动生成用例编号并记录上传信息。</p></section>
    <form id="uploadCaseForm" class="upload-case-card">
      <label class="upload-case-field"><span>测试用例文件 <i>*</i></span><div id="caseDropzone" class="case-dropzone"><input id="caseFile" name="file" type="file" required accept=".doc,.docx,.xls,.xlsx,.csv,.pdf,.zip"><span class="case-upload-icon">↑</span><strong>选择本地文件或拖拽至此处</strong><small>支持 Word、Excel 和项目允许的其他格式</small><em id="caseFileName">未选择文件</em></div></label>
      <label class="upload-case-field"><span>备注（选填）</span><input name="note" type="text" maxlength="200" placeholder="例如：发帖模块"></label>
      <p id="uploadCaseError" class="login-error hidden"></p>
      <button class="case-action-button upload-submit-button" type="submit">提交上传</button>
    </form>
  </main>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/workspace-nav.js"></script><script src="js/api.js"></script><script src="js/upload-test-case.js"></script>
</body>
</html>
